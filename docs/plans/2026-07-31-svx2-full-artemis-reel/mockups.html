<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Full Artemis reel mockups</title><style>
body{margin:0;background:#12100f;color:#eee4d5;font:15px/1.5 system-ui}main{max-width:960px;margin:auto;padding:30px 18px}p{color:#aa9886}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{background:#241d19;color:#eee4d5;border:1px solid #625043;border-radius:20px;padding:8px 12px}button.on{color:#ffd45c;border-color:#ffd45c}.screen{width:min(100%,640px);aspect-ratio:256/224;background:#000;position:relative;overflow:hidden;image-rendering:pixelated}.video{position:absolute;inset:0 0 32px;background:linear-gradient(120deg,#030404 30%,#412618 49%,#f1d2a3 52%,#1a100b 55%,#050505 70%)}.hud{position:absolute;inset:auto 0 0;height:32px;background:#020202;font:8px/8px monospace;padding:9px 8px;display:grid;grid-template-columns:1fr 1fr}.hud span:nth-child(even){text-align:right}.timeline{width:min(100%,640px);height:10px;background:#30251f;margin-top:14px;position:relative}.timeline i{position:absolute;top:-3px;width:4px;height:16px;background:#ffd45c}.title .video{inset:0;background:radial-gradient(circle,#70482b,#080605 55%)}.title .video:after{content:'SVX2 VIDEO\A FASTROM 30 FPS';white-space:pre;position:absolute;inset:40% 0;text-align:center;color:#ffd45c;font:bold 14px/2 monospace}.title .hud{display:none}code{color:#ffd45c}
</style></head><body><main><h1>Two-video, 900-frame Artemis reel</h1><p>Twenty seconds of NASA SVS animation followed by ten seconds of real launch-camera footage. The dashboard remains native Mode 1 BG3 below Mode 7.</p><div class="controls"><button data-s="title">Title</button><button class="on" data-s="0">Animation launch</button><button data-s="300">Animation return</button><button data-s="600">Cut to real camera</button><button data-s="899">Real camera end</button><button data-s="loop">Loop to animation</button></div><div id="screen" class="screen"><div class="video"></div><div class="hud"><span>SVX2 VIDEO</span><span>PLAY</span><span id="time">TIME 00:00</span><span>FPS 30.0</span></div></div><div class="timeline"><i id="mark" style="left:0"></i></div><p id="note">Keyframe 0 begins the animation video.</p><script>
const sc=document.querySelector('#screen'),mark=document.querySelector('#mark'),time=document.querySelector('#time'),note=document.querySelector('#note');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');let s=b.dataset.s;sc.className='screen'+(s==='title'?' title':'');let f=s==='loop'?900:s==='title'?0:+s;mark.style.left=(Math.min(f,899)/899*100)+'%';time.textContent='TIME 00:'+String(Math.min(30,Math.floor(f/30))).padStart(2,'0');note.textContent=s==='title'?'Title remains visible while both streams are validated.':s==='loop'?'Frame 899 restores the animation palette and keyframe 0.':f===600?'Independent keyframe 600 switches from the animation palette to real camera footage.':'Frame '+f+' of 899 ('+(f<600?'animation':'real camera')+').';});
</script></main></body></html>
