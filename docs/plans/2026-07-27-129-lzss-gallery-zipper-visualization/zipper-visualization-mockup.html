<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LZSS Gallery — Luminous Zipper Mockup</title>
<style>
  :root{color-scheme:dark;--ink:#d7fbff;--cyan:#18f7ff;--green:#b8ef00;--gold:#ffcf4a}
  *{box-sizing:border-box} body{margin:0;background:#080b12;color:var(--ink);font:15px/1.45 system-ui,sans-serif}
  main{max-width:1100px;margin:auto;padding:28px} h1{margin:0 0 8px;font-size:28px} p{max-width:72ch;color:#9fb4c0}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:18px;margin-top:24px}
  figure{margin:0;padding:14px;background:#101725;border:1px solid #26384a;border-radius:10px}
  canvas{display:block;width:100%;aspect-ratio:256/224;image-rendering:pixelated;background:#172536}
  figcaption{padding-top:9px;color:#b9cad2}.key{display:flex;gap:22px;margin:18px 0;flex-wrap:wrap}
  .swatch{display:inline-block;width:13px;height:13px;margin-right:6px;vertical-align:-2px;box-shadow:0 0 9px currentColor}
  @media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
<main>
  <h1>Luminous zipper — closure states</h1>
  <p>Fifteen alternating teeth close from the latched source toward the destination. A brighter head
  marks the newest tooth. Transparent 8×8 sprite cells are never drawn as boxes.</p>
  <div class="key">
    <span style="color:var(--cyan)"><i class="swatch"></i>biohack.net neon cyan</span>
    <span style="color:var(--green)"><i class="swatch"></i>indri.studio neon green</span>
  </div>
  <section class="grid" id="grid"></section>
</main>
<script>
const states=[
  {n:1,label:"Phase 1 — latch + bright head",a:[28,62],b:[221,62]},
  {n:5,label:"Phase 3 — first teeth interlock",a:[28,62],b:[221,62]},
  {n:9,label:"Phase 5 — diagonal closure",a:[35,42],b:[211,156]},
  {n:15,label:"Phase 8 — complete seam",a:[35,42],b:[211,156]}
];
const grid=document.querySelector("#grid");
for(const [index,s] of states.entries()){
  const fig=document.createElement("figure"),c=document.createElement("canvas");
  c.width=256;c.height=224;const x=c.getContext("2d");x.imageSmoothingEnabled=false;
  const g=x.createLinearGradient(0,0,256,224);g.addColorStop(0,"#27435a");g.addColorStop(1,"#8b6f48");
  x.fillStyle=g;x.fillRect(8,8,240,176);
  x.globalAlpha=.2;x.fillStyle="#e4d5a8";
  for(let y=16;y<178;y+=12)for(let q=12;q<244;q+=16)x.fillRect(q+(y%24),y,7,2);
  x.globalAlpha=1;const color=index<2?"#18f7ff":"#b8ef00";
  for(let i=0;i<s.n;i++){
    const t=i/14,px=s.a[0]+(s.b[0]-s.a[0])*t,py=s.a[1]+(s.b[1]-s.a[1])*t;
    x.shadowColor=color;x.shadowBlur=7;x.fillStyle=color;
    const dy=i%2?-2:2;x.fillRect(Math.round(px)-2,Math.round(py+dy),5,2);
    x.fillRect(Math.round(px),Math.round(py+dy+(i%2?-2:2)),1,2);
  }
  const t=(s.n-1)/14,hx=s.a[0]+(s.b[0]-s.a[0])*t,hy=s.a[1]+(s.b[1]-s.a[1])*t;
  x.shadowBlur=10;x.fillStyle="#fff";x.fillRect(Math.round(hx)-1,Math.round(hy)-1,3,3);
  x.shadowBlur=0;x.fillStyle="#07090d";x.fillRect(0,184,256,40);
  x.fillStyle="#ffcf4a";x.font="8px monospace";x.fillText("REPACK  MATCH  ZIP "+s.n+"/8",12,201);
  x.fillStyle="#9eb7c2";x.fillText("NO BOXES / NO RUN OUTLINES",12,214);
  fig.append(c);const cap=document.createElement("figcaption");cap.textContent=s.label;fig.append(cap);grid.append(fig);
}
</script>
</html>
