  divclock:
    desc: "#39: Constant-divisor clock + odometer — splits a frame tick into h:m:s and a counter into base-10 digits via COMPILE-TIME CONSTANT divides (/60 /10 /12). MEASURED FINDING: llvm-mos does NOT strength-reduce these to a magic reciprocal (retains __udivNi3 — the reciprocal's MULHU is itself a libcall on this soft-multiply target); correct cost decision, differential green. Sweeping analog clock + rolling odometer. Assert corpus_result (divclock_gate_crc 0xF72E) == host on MAME + bsnes-jg + disasm gate (udiv-libcall>=1, rep/sep). Leaves build/divclock.sfc + build/divclock-{mame,jg}.png."
