  hull:
    desc: "#65: Convex hull rubber-band — a cloud of points drifts and bounces; each frame the convex hull is recomputed by gift-wrapping (Jarvis march) purely from the SIGN of the signed 2-D cross product (int32 to avoid overflow), and drawn as a taut rubber band. A computational-geometry orientation test none of the first 64 demos run. Gate cross-checks the hull is valid (all points left of every edge). Assert corpus_result (hull_gate_crc 0xA58C) == host on MAME + bsnes-jg + disasm gate (__mulsi3 cross, cmp sign tests). Leaves build/hull.sfc + build/hull-{mame,jg}.png."
    cmds:
      - dev/run.sh hull

  hull-play:
    desc: "PLAY the Convex Hull demo in a MAME window on this host (builds the ROM first if needed). Shows a drifting point cloud wrapped by a rubber-band convex hull, recomputed each frame via cross-product orientation."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/hull.sfc ]; then
          echo "==> build/hull.sfc missing — building it (dev/run.sh hull)…"
          dev/run.sh hull
        fi
      - task: mandel-mame
        vars: { ROM: hull }

  radix:
    desc: "#64: Radix / counting sort — 16 bars sorted base-16 one nibble at a time: each pass histograms the digit, prefix-sums the counts into offsets, and stable-scatters the elements — a NON-COMPARISON sort (zero compares); shows raw -> low-nibble pass -> sorted, then reshuffles. Distinct from #17's comparison sorts. Gate cross-checks sorted (no inversions) + permutation (xor/sum). Assert corpus_result (radix_gate_crc 0x123E) == host on MAME + bsnes-jg + disasm gate (indexed scatter, no mul/div). Leaves build/radix.sfc + build/radix-{mame,jg}.png."
    cmds:
      - dev/run.sh radix

  radix-play:
    desc: "PLAY the Radix Sort demo in a MAME window on this host (builds the ROM first if needed). Shows a row of bars re-bucketing pass by pass via counting sort until sorted, then reshuffling."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/radix.sfc ]; then
          echo "==> build/radix.sfc missing — building it (dev/run.sh radix)…"
          dev/run.sh radix
        fi
      - task: mandel-mame
        vars: { ROM: radix }

  fenwick:
    desc: "#63: Fenwick tree (binary-indexed tree) — a moving bump point-updates 16 bins each frame; the running prefix sum (integral) is queried back and drawn as a rising staircase below the signal. Both walks use the i & -i low-bit-isolation two's-complement trick (update i+=i&-i, query i-=i&-i). Gate cross-checks the BIT prefix vs a linear reference. Assert corpus_result (fenwick_gate_crc 0x3454) == host on MAME + bsnes-jg + disasm gate (and-masks, no mul/div). Leaves build/fenwick.sfc + build/fenwick-{mame,jg}.png."
    cmds:
      - dev/run.sh fenwick

  fenwick-play:
    desc: "PLAY the Fenwick Tree demo in a MAME window on this host (builds the ROM first if needed). Shows a moving signal and its running integral (prefix sum) maintained by a binary-indexed tree."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/fenwick.sfc ]; then
          echo "==> build/fenwick.sfc missing — building it (dev/run.sh fenwick)…"
          dev/run.sh fenwick
        fi
      - task: mandel-mame
        vars: { ROM: fenwick }

  percol:
    desc: "#62: Union-find percolation — bond percolation on a 16x16 grid: random adjacent bonds union cells' sets (disjoint-set with PATH COMPRESSION: find chases parent pointers to the root and rewrites the whole path); cells connected to the top light up 'wet' until the wet region reaches the bottom (percolation), then reseeds. The corner: the union-find find-with-compression pointer flatten (distinct from #18's heap, #31's tree). Assert corpus_result (percol_gate_crc 0x025B) == host on MAME + bsnes-jg + disasm gate (parent-chase branches). Leaves build/percol.sfc + build/percol-{mame,jg}.png."
    cmds:
      - dev/run.sh percol

  percol-play:
    desc: "PLAY the Union-Find Percolation demo in a MAME window on this host (builds the ROM first if needed). Shows a wet region spreading from the top through random bonds until it percolates to the bottom."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/percol.sfc ]; then
          echo "==> build/percol.sfc missing — building it (dev/run.sh percol)…"
          dev/run.sh percol
        fi
      - task: mandel-mame
        vars: { ROM: percol }

  dhmix:
    desc: "#61: Diffie-Hellman colour-mixer — two parties publish A=g^a mod p, B=g^b mod p, then both compute the shared secret g^(ab) mod p; three colour bands (Alice/shared/Bob) shift while the shared bands always agree. Hot op = 64-bit modulo (__umoddi3) in a square-and-multiply modpow. 🐞 FOUND+FIXED an a16/xy16 legalizer crash (G_UNMERGE_VALUES s64->s16 / G_ANYEXT s24; patch 0017). Assert corpus_result (dhmix_gate_crc 0xB7C4) == host on MAME + bsnes-jg + disasm gate (__umoddi3, __muldi3). Leaves build/dhmix.sfc + build/dhmix-{mame,jg}.png."
    cmds:
      - dev/run.sh dhmix

  dhmix-play:
    desc: "PLAY the Diffie-Hellman Colour-Mixer demo in a MAME window on this host (builds the ROM first if needed). Shows two parties' public colours mixing to an identical shared-secret colour via 64-bit modular exponentiation."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/dhmix.sfc ]; then
          echo "==> build/dhmix.sfc missing — building it (dev/run.sh dhmix)…"
          dev/run.sh dhmix
        fi
      - task: mandel-mame
        vars: { ROM: dhmix }

  multibase:
    desc: "#60: Multi-base clock — one climbing counter shown in four bases at once (decimal, dozenal, hex, sexagesimal), each digit split with the libc div() returning a div_t (quotient+remainder) BY VALUE, plus a 64-bit odometer via lldiv() returning an lldiv_t. The corner: the div_t/lldiv_t aggregate-return ABI + the custom G_SDIVREM legalizer @229 (distinct from #39's `/`,`%` and #43's raw 64-bit divmod). Assert corpus_result (multibase_gate_crc 0xF43F) == host on MAME + bsnes-jg + disasm gate (div/lldiv calls). Leaves build/multibase.sfc + build/multibase-{mame,jg}.png."
    cmds:
      - dev/run.sh multibase

  multibase-play:
    desc: "PLAY the Multi-Base Clock demo in a MAME window on this host (builds the ROM first if needed). Shows one counter ticking in decimal, dozenal, hex and sexagesimal at once, split with libc div()/lldiv()."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/multibase.sfc ]; then
          echo "==> build/multibase.sfc missing — building it (dev/run.sh multibase)…"
          dev/run.sh multibase
        fi
      - task: mandel-mame
        vars: { ROM: multibase }

  cosmzoom:
    desc: "#59: Cosmic zoom ruler — a uint64 scale grows exponentially and is placed on a LOG ruler by converting it to float (so exponential growth reads as a linear sweep), then back to uint64 for the read-out. The conversions are __floatundisf / __fixunssfdi / __floatdisf / __fixsfdi — 64-bit int <-> float (#21/#33 converted only 32-bit ints). Assert corpus_result (cosm_gate_crc 0x502F) == host on MAME + bsnes-jg + disasm gate. Leaves build/cosmzoom.sfc + build/cosmzoom-{mame,jg}.png."
    cmds:
      - dev/run.sh cosmzoom

  cosmzoom-play:
    desc: "PLAY the Cosmic Zoom Ruler demo in a MAME window on this host (builds the ROM first if needed). Shows a log-scale bar sweeping linearly as a 64-bit scale grows exponentially through the powers of ten."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/cosmzoom.sfc ]; then
          echo "==> build/cosmzoom.sfc missing — building it (dev/run.sh cosmzoom)…"
          dev/run.sh cosmzoom
        fi
      - task: mandel-mame
        vars: { ROM: cosmzoom }

  domcol:
    desc: "#58: Complex domain-colouring with poles — colours a grid by the rational map f(z)=(z^2-1)/(z^2+c); where z^2+c==0 the divide gives Inf/NaN and the code branches on isnan (x!=x -> __unordsf2, the unordered compare) / isinf to paint the poles, which drift as c moves. Folds the COLOUR INDEX, never raw NaN bits. Soft-float one-op-per-statement. Assert corpus_result (domcol_gate_crc 0x540B) == host on MAME + bsnes-jg + disasm gate (__unordsf2, __divsf3). Leaves build/domcol.sfc + build/domcol-{mame,jg}.png."
    cmds:
      - dev/run.sh domcol

  domcol-play:
    desc: "PLAY the Complex Domain-Colouring demo in a MAME window on this host (builds the ROM first if needed). Shows the poles of a rational complex map gliding across a colour field as the parameter drifts."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/domcol.sfc ]; then
          echo "==> build/domcol.sfc missing — building it (dev/run.sh domcol)…"
          dev/run.sh domcol
        fi
      - task: mandel-mame
        vars: { ROM: domcol }

  medfilt:
    desc: "#57: Median denoiser — a salt-and-pepper-noised image is cleaned by a 3x3 median filter; a sweeping wipe shows denoised vs raw. The median-of-9 is a 19-comparator branchless sorting network of min/max compare-exchanges (the select idiom (a<b)?a:b = G_UMIN/G_UMAX .lower() @272 -> cmp+branch), + abs (G_ABS @281). Gate cross-checks the network median vs an insertion-sort median. Assert corpus_result (medfilt_gate_crc 0x87FE) == host on MAME + bsnes-jg + disasm gate (cmp density, no mul/div libcall). Leaves build/medfilt.sfc + build/medfilt-{mame,jg}.png."
    cmds:
      - dev/run.sh medfilt

  medfilt-play:
    desc: "PLAY the Median Denoiser demo in a MAME window on this host (builds the ROM first if needed). Shows a sweeping wipe between salt-and-pepper noise and its 3x3 median-filtered result."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/medfilt.sfc ]; then
          echo "==> build/medfilt.sfc missing — building it (dev/run.sh medfilt)…"
          dev/run.sh medfilt
        fi
      - task: mandel-mame
        vars: { ROM: medfilt }

  rotozoom:
    desc: "#56: Rotozoom — an affine texture spin-zoom; each cell samples a procedural texture at a Q16.16 rotated/scaled coord, where q16mul(a,b)=(int64)a*b>>16 is the WIDENING MULTIPLY-HIGH (G_SMULH/G_UMULH .lower() @300, via __muldi3 on this soft-multiply target). Assert corpus_result (rotozoom_gate_crc 0xD448) == host on MAME + bsnes-jg + disasm gate (__muldi3, __mulsi3, SINCOS, rep/sep). Leaves build/rotozoom.sfc + build/rotozoom-{mame,jg}.png."
    cmds:
