          echo "==> build/rotozoom.sfc missing — building it (dev/run.sh rotozoom)…"
          dev/run.sh rotozoom
        fi
      - task: mandel-mame
        vars: { ROM: rotozoom }

  gf256:
    desc: "#55: GF(2^8) Galois field — each cell's colour is a finite-field combination gf_mul(A,α^x)^gf_mul(B,α^y) (A,B rotate through α-powers → morphing plaid); the field multiply is a CARRYLESS multiply via log/antilog tables + XOR (no carry chain), the arithmetic under Reed-Solomon/QR. HUD shows a live RS syndrome. Gate cross-checks gf_mul vs a slow bit-by-bit carryless multiply. Assert corpus_result (gf256_gate_crc 0xC028) == host on MAME + bsnes-jg + disasm gate (GF_EXP/GF_LOG refs, eor, no mul/div libcall). Leaves build/gf256.sfc + build/gf256-{mame,jg}.png."
    cmds:
      - dev/run.sh gf256

  gf256-play:
    desc: "PLAY the GF(2^8) Galois Field demo in a MAME window on this host (builds the ROM first if needed). Shows a morphing finite-field plaid coloured by GF(2^8) carryless multiplies."
    cmds:
      - |
        set -euo pipefail
