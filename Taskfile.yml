          echo "==> build/gf256.sfc missing — building it (dev/run.sh gf256)…"
          dev/run.sh gf256
        fi
      - task: mandel-mame
        vars: { ROM: gf256 }

  bitshuffle:
    desc: "#54: Perfect-shuffle transition — a source image is permuted by the bit-reversal of each cell's index (__builtin_bitreverse32, G_BITREVERSE inline mask-swap cascade; involution → scramble/unscramble), byte-swap recolour via __builtin_bswap32. Assert corpus_result (bitshuffle_gate_crc 0x2A4A) == host on MAME + bsnes-jg + disasm gate (bitrev masks 0xAA/0xCC, rep/sep). Leaves build/bitshuffle.sfc + build/bitshuffle-{mame,jg}.png."
