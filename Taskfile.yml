  crctex:
    desc: "#40: Table-driven CRC32 procedural texture — each cell's colour is a real CRC32 (poly 0xEDB88320) of its (x,y,time) via the byte-at-a-time algorithm crc=TABLE[(crc^byte)&0xFF]^(crc>>8), TABLE a const uint32[256] in ROM. Flowing hash-marble field. Assert corpus_result (crctex_gate_crc 0xDBBA) == host on MAME + bsnes-jg + disasm gate (CRC32_TAB ref, eor cascade, rep/sep). Leaves build/crctex.sfc + build/crctex-{mame,jg}.png."
