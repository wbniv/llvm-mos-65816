version: '3'

# Shared cross-project tasks (md, shot, pr-preview, memory-viz, …) from the
# python-tui-lib library. flatten: true exposes them at top level so
# `task md -- TODO.md` works; optional: true keeps `task` usable if the
# sibling repo isn't checked out next to this one.
includes:
  shared:
    taskfile: ../python-tui-lib/Taskfile.shared.yml
    optional: true
    flatten: true

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # --- Host-side dev/test prerequisites ---

  dev-setup:
    desc: "Install host-side dev/test prerequisites (cvise for C-reduction of fuzz repros, …). Idempotent; uses sudo apt."
    silent: true
    cmds:
      - |
        set -euo pipefail
        need=()
        command -v cvise >/dev/null || need+=(cvise)
        if [ ${#need[@]} -eq 0 ]; then echo "host prereqs already present: cvise"; exit 0; fi
        echo "installing: ${need[*]}"
        sudo apt-get update -qq
        sudo apt-get install -y "${need[@]}"

  # --- Dev image / build pipeline (thin wrappers over dev/run.sh) ---

  build:
    desc: "(re)build the dev image, vendor llvm-mos-sdk + platforms/snes, compile examples/snes/hello.c -> build/hello.sfc"
    cmds:
      - dev/run.sh build

  compile:
    desc: "Compile the SNES example inside the dev container (assumes the image is already built)"
    cmds:
      - dev/run.sh compile

  validate:
    desc: "Structural validation of build/hello.sfc (reset->crt0 byte-exact, main() placed, checksum 0xFFFF)"
    cmds:
      - dev/run.sh validate

  smoke:
    desc: "Boot build/hello.sfc headless in MAME's snes driver, assert sentinel==0x42 in WRAM (needs the SPC700 IPL)"
    cmds:
      - dev/run.sh smoke

  repro:
    desc: "Clean-room: fresh checkout, then build + smoke inside it (host-side orchestration)"
    cmds:
      - dev/run.sh repro {{.CLI_ARGS}}

  ci-watch:
    desc: "Live-monitor a GitHub Actions run (default: latest snes-smoke): streams step transitions + heartbeat + final verdict. Args: [RUN_ID] | --once"
    cmds:
      - dev/ci-watch.sh {{.CLI_ARGS}}

  # --- #321 beefy Mandelbrot demo ---

  mandel-mame:
    desc: "Run a Mandelbrot demo ROM in a MAME WINDOW on this host (ROM=mandel-display [default] | mandel-mode7 | mandel-interactive | mandel-zoom | k_mandel_far). Build the ROM first via task mandel-shot / mandel-mode7 / mandel-interactive / mandel-zoom / mandel-far."
    cmds:
      - |
        set -euo pipefail
        ROM='{{.ROM | default "mandel-display"}}'
        SFC="build/${ROM}.sfc"
        if [ ! -f "$SFC" ]; then
          echo "missing $SFC — build it first:"
          case "$ROM" in
            mandel-display)     echo "    task mandel-shot        (Track 2 fat-pixel BG)";;
            mandel-mode7)       echo "    task mandel-mode7       (Track 3b 128x128 Mode 7)";;
            mandel-interactive) echo "    task mandel-interactive (M2 instant-boot Mode 7 fly-around)";;
            mandel-zoom)        echo "    task mandel-zoom        (M2 zoom pyramid — increasing detail)";;
            k_mandel_far)       echo "    task mandel-far         (Track 3a far-store gate)";;
            *)              echo "    (unknown ROM '$ROM' — use mandel-display | mandel-mode7 | mandel-interactive | mandel-zoom | k_mandel_far)";;
          esac
          exit 1
        fi
        [ -f dev/roms/s_smp/spc700.rom ] || { echo "missing dev/roms/s_smp/spc700.rom (SPC700 IPL) — MAME's snes driver needs it."; exit 1; }
        case "$ROM" in
          mandel-mode7) echo "note: mandel-mode7's 128x128 software compute is ~4 min of EMULATED time — the screen stays black until it finishes, then shows the image." ;;
          mandel-display) echo "note: the image appears after the ~15 s (emulated) compute." ;;
          mandel-interactive) echo "note: INSTANT boot. KEYS (remapped to match the labels): arrows=pan | L/R=zoom out/in | Y/A=rotate | S=cycle palette | Enter=reset." ;;
          mandel-zoom) echo "note: INSTANT boot. KEYS (remapped to match the labels): hold R=DIVE (detail refreshes at each level), L=back out | Y/A=rotate | S=cycle palette | Enter=reset to level 0." ;;
        esac
        echo "launching $SFC in MAME — close the window to quit."
        mkdir -p build/.mame
        # MAME's default SNES P1 keys are non-obvious (SNES R=keyboard X, Y=Left-Ctrl, A=Space), so the
        # demo labels wouldn't match the keys. Drop in our remap (snes.cfg) so keyboard R/L/Y/A/S/Enter
        # match the on-screen R/L/Y/A/Select/Start; D-pad stays on the arrows. See dev/mame-snes-input.cfg.
        cp -f dev/mame-snes-input.cfg build/.mame/snes.cfg
        exec mame snes -cart "$SFC" -rompath dev/roms -skip_gameinfo -window \
          -cfg_directory build/.mame -nvram_directory build/.mame

  mandel-shot:
    desc: "#321 Track 2: render the fat-pixel Mandelbrot ON the SNES, screenshot from MAME + bsnes-jg (headless). Leaves build/mandel-display.sfc."
    cmds:
      - dev/run.sh mandel-shot

  mandel-mode7:
    desc: "#321 Track 3b: 128x128 per-pixel Mandelbrot via Mode 7 + DMA + far stores, screenshot both emulators (headless). Leaves build/mandel-mode7.sfc."
    cmds:
      - dev/run.sh mandel-mode7

  mandel-far:
    desc: "#321 Track 3a: Mandelbrot into high WRAM via #320 far stores, asserted host==+mos-a16 on both emulators. Leaves build/k_mandel_far.sfc."
    cmds:
      - dev/run.sh mandel-far

  mandel-interactive:
    desc: "#321 M2: INTERACTIVE Mandelbrot — host-baked image DMA'd ROM->VRAM for an instant boot, then a Mode 7 joypad fly-around. Builds default + +mos-a16, asserts image hash==host + a scripted-input view-math differential, screenshots both emulators. Leaves build/mandel-interactive.sfc (then: task mandel-play)."
    cmds:
      - dev/run.sh mandel-interactive

  mandel-play:
    desc: "PLAY the interactive Mandelbrot in a MAME WINDOW on this host (builds the ROM first if needed). Controls: D-pad pan | L/R zoom | Y/A rotate | Select palette | Start reset."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/mandel-interactive.sfc ]; then
          echo "==> build/mandel-interactive.sfc missing — building it (dev/run.sh mandel-interactive)…"
          dev/run.sh mandel-interactive
        fi
      - task: mandel-mame
        vars: { ROM: mandel-interactive }

  mandel-zoom:
    desc: "#321 M2: Mandelbrot ZOOM PYRAMID — true increasing detail on zoom-in. Host bakes a stack of 2x-finer levels; the ROM DMAs the next level as zoom crosses each 2x threshold (instant; zero on-console fractal math). Builds default + +mos-a16, asserts a per-level image hash + a scripted-zoom view-math differential, screenshots both emulators. Leaves build/mandel-zoom.sfc (then: task mandel-zoom-play)."
    cmds:
      - dev/run.sh mandel-zoom

  mandel-zoom-play:
    desc: "PLAY the Mandelbrot zoom pyramid in a MAME WINDOW on this host (builds the ROM first if needed). Hold R to DIVE into deeper detail, L to back out | Y/A rotate | Select palette | Start reset."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/mandel-zoom.sfc ]; then
          echo "==> build/mandel-zoom.sfc missing — building it (dev/run.sh mandel-zoom)…"
          dev/run.sh mandel-zoom
        fi
      - task: mandel-mame
        vars: { ROM: mandel-zoom }
