          echo "==> build/bitshuffle.sfc missing — building it (dev/run.sh bitshuffle)…"
          dev/run.sh bitshuffle
        fi
      - task: mandel-mame
        vars: { ROM: bitshuffle }

  bitcensus:
    desc: "#53: Bit-census field — each cell's colour is a bit-population count (popcount/clz/ctz/parity) of a 64-bit value from its (x,y,time), cycling the four __builtin_*ll intrinsics; they inline-lower via G_CTPOP/G_CTLZ/G_CTTZ (SWAR masks 0x55/0x33 in the disasm). XOR-fractal / magnitude / ruler / checker textures. Assert corpus_result (bitcensus_gate_crc 0x9516) == host on MAME + bsnes-jg + disasm gate. Leaves build/bitcensus.sfc + build/bitcensus-{mame,jg}.png."
