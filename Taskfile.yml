  gouraud:
    desc: "#69: Gouraud triangle tumbler — a spinning equilateral triangle whose three vertices carry three brightnesses is FILLED and colour-interpolated per pixel: three signed cross-product edge functions (bx-ax)(py-ay)-(by-ay)(px-ax) decide inside/outside, and their values are the barycentric weights that shade the face across four bands. Distinct from #16's wireframe LINES. The gate exercises the per-pixel barycentric DIVIDE (num/area). Assert corpus_result (gouraud_gate_crc 0x209C) == host on MAME + bsnes-jg + disasm gate (__mulsi3, __divsi3). Leaves build/gouraud.sfc + build/gouraud-{mame,jg}.png."
