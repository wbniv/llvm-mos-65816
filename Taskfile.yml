version: '3'

# Shared cross-project tasks (md, shot, pr-preview, memory-viz, …) from the
# python-tui-lib library. flatten: true exposes them at top level so
# `task md -- TODO.md` works; optional: true keeps `task` usable if the
# sibling repo isn't checked out next to this one.
includes:
  shared:
    taskfile: ../python-tui-lib/Taskfile.shared.yml
    optional: true
    flatten: true

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # --- Host-side dev/test prerequisites ---

  dev-setup:
    desc: "Install host-side dev/test prerequisites (cvise for C-reduction of fuzz repros, …). Idempotent; uses sudo apt."
    silent: true
    cmds:
      - |
        set -euo pipefail
        need=()
        command -v cvise >/dev/null || need+=(cvise)
        if [ ${#need[@]} -eq 0 ]; then echo "host prereqs already present: cvise"; exit 0; fi
        echo "installing: ${need[*]}"
        sudo apt-get update -qq
        sudo apt-get install -y "${need[@]}"

  # --- Dev image / build pipeline (thin wrappers over dev/run.sh) ---

  build:
    desc: "(re)build the dev image, vendor llvm-mos-sdk + platforms/snes, compile examples/snes/hello.c -> build/hello.sfc"
    cmds:
      - dev/run.sh build

  compile:
    desc: "Compile the SNES example inside the dev container (assumes the image is already built)"
    cmds:
      - dev/run.sh compile

  validate:
    desc: "Structural validation of build/hello.sfc (reset->crt0 byte-exact, main() placed, checksum 0xFFFF)"
    cmds:
      - dev/run.sh validate

  smoke:
    desc: "Boot build/hello.sfc headless in MAME's snes driver, assert sentinel==0x42 in WRAM (needs the SPC700 IPL)"
    cmds:
      - dev/run.sh smoke

  repro:
    desc: "Clean-room: fresh checkout, then build + smoke inside it (host-side orchestration)"
    cmds:
      - dev/run.sh repro {{.CLI_ARGS}}

  # --- Interim release packaging (until #320/#321 land upstream) ---

  release-builtins:
    desc: "Force-rebuild the toolchain's mos compiler-rt builtins so libclang_rt.builtins.a matches the CURRENT backend data layout. LLVM's runtimes sub-build doesn't re-trigger on a backend-only change (e.g. patch 0006 adding the packed-24 'p3:24:8' addrspace), leaving stale builtins that the SDK merges into libcrt → 'different data layouts' warnings on every user link. Reinstalls into build/llvm-mos-install."
    cmds:
      - dev/run.sh rebuild-builtins

  release-sdk:
    desc: "Clean-rebuild build/install (SNES SDK) against the PATCHED toolchain so libc/crt0/libcrt carry the far-pointer data layout — eliminates the ld.lld 'different data layouts' warnings. Forces a CLEAN build (sentinel stamp) because an incremental SDK build does NOT re-merge libcrt after release-builtins refreshes the toolchain's builtins.a."
    deps: [release-builtins]
    cmds:
      # Make dev/build.sh wipe + clean-rebuild: its toolchain stamp is path-based and
      # can't see that release-builtins changed the toolchain's builtins.a *content*.
      # A clean build is the only thing that reliably re-merges libcrt.
      - echo 'release-clean' > build/.mos-toolchain
      - MOS_TOOLCHAIN=/work/build/llvm-mos-install dev/run.sh build

  package:
    desc: "Assemble the relocatable Linux x86-64 toolchain+SDK into dist/llvm-mos-65816-<stamp>-linux-x86_64.tar.xz (+ .sha256). GATES (both must pass or the tarball is not a publish candidate): (1) WARNING-FREE self-test — fails on any clang/ld.lld warning; (2) CLEAN-ROOM emulator test — task release-test METHOD=local builds+runs the tarball's own mos-snes-clang in bsnes-jg (default-8bit + +mos-a16) and asserts the WRAM CRC. Runs release-builtins + release-sdk first. Env: STRIP=0 keeps debug, RELEASE_DOCS_DIR=<dir> bundles docs, SKIP_RELEASE_TEST=1 bypasses the clean-room gate (NOT for a real publish)."
    deps: [release-sdk]
    cmds:
      - dev/package-release.sh {{.CLI_ARGS}}

  cross-build:
    desc: "Cross-build the clang/lld/llvm-* HOST tools for a NON-native host into build/llvm-mos-install-<PLATFORM>. PLATFORM=linux-arm64|windows-x86_64. Needs the native toolchain built first (reuses its tablegens). Long (~30-90 min cold; ccache-warm after). e.g. `task cross-build PLATFORM=linux-arm64`."
    cmds:
      - dev/run.sh cross-toolchain {{.PLATFORM}}

  package-all:
    desc: "Assemble ALL 3 interim platform packages into dist/: linux-x86_64 (kept, byte-identical) + linux-arm64 + windows-x86_64. The native leg runs the full SDK-rebuild + clean-room bsnes-jg gate; the cross legs reuse the native SDK and self-test under qemu/wine (ROM bytes must match native). PREREQ: both cross toolchains built (task cross-build PLATFORM=linux-arm64 ; task cross-build PLATFORM=windows-x86_64). macOS arm64 is deferred (needs a macOS SDK). Interim until #321 lands upstream."
    cmds:
      - task: package
      - dev/package-release.sh PLATFORM=linux-arm64
      - dev/package-release.sh PLATFORM=windows-x86_64
      - 'echo "==> dist/ now holds:" && ls -1 dist/*.tar.xz dist/*.zip 2>/dev/null'

  release-test:
    desc: "Clean-room test the PUBLISHED SNES compiler in a throwaway Docker container with NO dev toolchain: acquire mos-snes-clang, compile examples/snes/mandel-display.c (+mos-a16 — the far/16-bit tester is a16-only), run in bsnes-jg (embedded SPC700 IPL → no BIOS/sound), assert the WRAM corpus_result CRC == the host oracle (0x204F) + dump an emulator PNG. METHOD=local (newest dist/*.tar.xz — the publish gate, also auto-run by `task package`) | apt (live apt.indri.studio) | tarball (product-page link). Knobs: PROGRAM=mandel-display|k_mandel, A16=both|1|0 (mandel-display forces a16-only), TARBALL=<path>, FRAMES=n. Pass as `task release-test -- METHOD=apt`."
    cmds:
      - dev/test-release.sh {{.CLI_ARGS}}

  ci-watch:
    desc: "Live-monitor a GitHub Actions run (default: latest snes-smoke): streams step transitions + heartbeat + final verdict. Args: [RUN_ID] | --once"
    cmds:
      - dev/ci-watch.sh {{.CLI_ARGS}}

  # --- #321 beefy Mandelbrot demo ---

  mandel-mame:
    desc: "Run a Mandelbrot demo ROM in a MAME WINDOW on this host (ROM=mandel-display [default] | k_mandel_far). Build the ROM first via task mandel-shot / mandel-far."
    cmds:
      - |
        set -euo pipefail
        ROM='{{.ROM | default "mandel-display"}}'
        SFC="build/${ROM}.sfc"
        if [ ! -f "$SFC" ]; then
          echo "missing $SFC — build it first:"
          case "$ROM" in
            mandel-display) echo "    task mandel-shot   (far Mode 7 tester)";;
            k_mandel_far)   echo "    task mandel-far    (Track 3a far-store gate)";;
            *)              echo "    (unknown ROM '$ROM' — use mandel-display | k_mandel_far)";;
          esac
          exit 1
        fi
        [ -f dev/roms/s_smp/spc700.rom ] || { echo "missing dev/roms/s_smp/spc700.rom (SPC700 IPL) — MAME's snes driver needs it."; exit 1; }
        case "$ROM" in
          mandel-display) echo "note: the image appears after the ~15 s (emulated) compute." ;;
        esac
        echo "launching $SFC in MAME — close the window to quit."
        mkdir -p build/.mame
        # MAME's default SNES P1 keys are non-obvious (SNES R=keyboard X, Y=Left-Ctrl, A=Space), so the
        # demo labels wouldn't match the keys. Drop in our remap (snes.cfg) so keyboard R/L/Y/A/S/Enter
        # match the on-screen R/L/Y/A/Select/Start; D-pad stays on the arrows. See dev/mame-snes-input.cfg.
        cp -f dev/mame-snes-input.cfg build/.mame/snes.cfg
        exec mame snes -cart "$SFC" -rompath dev/roms -skip_gameinfo -window \
          -cfg_directory build/.mame -nvram_directory build/.mame

  mandel-shot:
    desc: "#321: render the canonical on-SNES Mandelbrot tester (far-stored into high WRAM, displayed via Mode 7; +mos-a16) ON the SNES, screenshot from MAME + bsnes-jg (headless). Leaves build/mandel-display.sfc."
    cmds:
      - dev/run.sh mandel-shot

  mandel-oop:
    desc: "snesgfx formal verification: OOP Mandelbrot — Mode 7 as a Drawable (MandelLayer), corpus_result == 0x204F (+mos-a16). Proves: (1) Mode 7 OOP, (2) no bare REG_*/snes_* in main(), (3) coarse-grained dispatch (1 virtual call/frame). Disasm + size delta vs mandel-display printed. Leaves build/mandel-oop.sfc + build/mandel-oop-jg.png."
    cmds:
      - dev/run.sh mandel-oop

  mandel-oop-play:
    desc: "PLAY the OOP Mandelbrot verification client in a MAME window (builds first if needed). Same 64x56 Mandelbrot as mandel-display but orchestrated through the snesgfx Display + MandelLayer OOP interface."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/mandel-oop.sfc ]; then
          echo "==> build/mandel-oop.sfc missing — building it (dev/run.sh mandel-oop)…"
          dev/run.sh mandel-oop
        fi
      - task: mandel-mame
        vars: { ROM: mandel-oop }

  mandel-far:
    desc: "#321 Track 3a: Mandelbrot into high WRAM via #320 far stores, asserted host==+mos-a16 on both emulators. Leaves build/k_mandel_far.sfc."
    cmds:
      - dev/run.sh mandel-far

  blossom:
    desc: "#3: the INTERACTIVE Hopalong/Blossom attractor on the SNES — far read-modify-write hit grid + Mode 7 band DMA + cycling hue palette + split-screen HUD + joypad. +mos-a16-only; asserts the grid hash host==+mos-a16 on both emulators AND a scripted-input controller-state differential, screenshots both. Leaves build/blossom.sfc (then: task blossom-play)."
    cmds:
      - dev/run.sh blossom

  blossom-grid:
    desc: "#3 Stage 1: the headless far read-modify-write HIT-GRID gate — plot Hopalong points into a 128x128 grid at high WRAM $7E2000 via the far path, far-load hash, assert host==+mos-a16 on both emulators + a far-RMW disasm gate. Leaves build/k_blossom_far.sfc."
    cmds:
      - dev/run.sh blossom-grid

  blossom-play:
    desc: "PLAY the interactive Blossom attractor in a MAME WINDOW on this host (builds the ROM first if needed). The attractor blooms in over ~10 s then shimmers. Arrows pan | L/R zoom | A/Y next/prev attractor | Select colour | Start reset."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/blossom.sfc ]; then
          echo "==> build/blossom.sfc missing — building it (dev/run.sh blossom)…"
          dev/run.sh blossom
        fi
      - task: mandel-mame
        vars: { ROM: blossom }

  buddha:
    desc: "#4: Buddhabrot — escaping-orbit DENSITY accumulation on the SNES — far scatter-write hit grid ($7E2000) + Mode 7 band DMA + ghostly glow palette. +mos-a16-only; asserts the grid hash host==+mos-a16 on bsnes-jg + MAME, screenshots both. Leaves build/buddha.sfc + build/buddha-{jg,mame}.png (then: task buddha-play)."
    cmds:
      - dev/run.sh buddha

  buddha-grid:
    desc: "#4 headless: the far SCATTER-WRITE density-grid gate — draw K_GATE random samples, iterate z^2+c, replay escaping orbits into a 128x128 grid at high WRAM $7E2000 via the far RMW path, far-load hash, assert host==+mos-a16 on both emulators + a far-RMW + complex-multiply disasm gate. Leaves build/k_buddha_far.sfc."
    cmds:
      - dev/run.sh buddha-grid

  buddha-play:
    desc: "PLAY the Buddhabrot demo in a MAME WINDOW on this host (builds the ROM first if needed). The density cloud blooms in progressively as escaping orbits accumulate."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/buddha.sfc ]; then
          echo "==> build/buddha.sfc missing — building it (dev/run.sh buddha)…"
          dev/run.sh buddha
        fi
      - task: mandel-mame
        vars: { ROM: buddha }

  spirograph:
    desc: "#11: render the Spirograph (hypotrochoid) demo on SNES (+mos-a16); assert curve hash host==+mos-a16 on MAME + bsnes-jg + disasm gate. Leaves build/spirograph.sfc + build/spirograph-{mame,jg}.png."
    cmds:
      - dev/run.sh spirograph

  n-body:
    desc: "#13: N-body orbits — Newtonian gravity (1/r²) + Verlet; assert corpus_result (nbody_gate_crc 0xCC65) == host on MAME + bsnes-jg + disasm gate (__udivsi3 + __mulsi3 + rep/sep). Leaves build/n-body.sfc + build/n-body-{mame,jg}.png."
    cmds:
      - dev/run.sh n-body

  pi:
    desc: "#19: render the π Spigot + Monte-Carlo demo on SNES (+mos-a16); assert corpus_result (pi_gate_crc 0x7711) == host on MAME + bsnes-jg + disasm gate (__udivmodsi4 + __mulsi3 + rep/sep). Leaves build/spigot.sfc + build/spigot-{mame,jg}.png."
    cmds:
      - dev/run.sh pi

  epicycles:
    desc: "#10: Fourier epicycles — a sum of 8 rotating vectors (DFT of a star) traces the outline; sin/cos-LUT sweep with 4 __mulsi3 per harmonic + 32-bit accumulate, NO divide (the many-multiply member). Assert corpus_result (epi_gate_crc 0x4F6C) == host on bsnes-jg (+ MAME if SPC700 IPL present) + disasm gate (__mulsi3 + rep/sep, divide=0). Leaves build/epicycles.sfc + build/epicycles-{jg,mame}.png."
    cmds:
      - dev/run.sh epicycles

  epicycles-play:
    desc: "PLAY the Fourier-epicycles demo in a MAME window on this host (builds the ROM first if needed). Shows nested generating circles + a 5-pointed star outline drawing itself, looping."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/epicycles.sfc ]; then
          echo "==> build/epicycles.sfc missing — building it (dev/run.sh epicycles)…"
          dev/run.sh epicycles
        fi
      - task: mandel-mame
        vars: { ROM: epicycles }

  maze:
    desc: "#18: Maze generate + solve — recursive-division carve (genuine recursion, ~log depth to fit the 65816 256-byte HW stack) + A* indexed binary-heap solve (16x15), animated. Assert corpus_result (maze_gate_crc 0x0749) == host on bsnes-jg (+ MAME if SPC700 IPL present) + disasm gate (recursion self-call + rep/sep; no 32-bit libcalls). Leaves build/maze.sfc + build/maze-{jg,mame}.png."
    cmds:
      - dev/run.sh maze

  maze-play:
    desc: "PLAY the maze gen+solve demo in a MAME window on this host (builds the ROM first if needed). Shows a maze carved, then A* exploring (dim cells) and the shortest path lit (yellow), looping with new mazes."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/maze.sfc ]; then
          echo "==> build/maze.sfc missing — building it (dev/run.sh maze)…"
          dev/run.sh maze
        fi
      - task: mandel-mame
        vars: { ROM: maze }

  julia:
    desc: "#1: Julia set explorer — z^2+c with c animated along the 0.7885*e^itheta orbit; the whole 64x56 Mode-7 image RECOMPUTED every keyframe (sustained Q5.10 complex multiply, 3 __mulsi3/iter) and FAR-STORED into high WRAM $7E2000 (+mos-a16). Assert corpus_result (julia_gate_crc 0x3490) == host on bsnes-jg (+ MAME if SPC700 IPL present) + disasm gate (__mulsi3 + rep/sep). Leaves build/julia.sfc + build/julia-{jg,mame}.png."
    cmds:
      - dev/run.sh julia

  julia-play:
    desc: "PLAY the Julia-set explorer in a MAME window on this host (builds the ROM first if needed). Shows a morphing Julia fractal sweeping top-to-bottom as c orbits the path, colour-cycled."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/julia.sfc ]; then
          echo "==> build/julia.sfc missing — building it (dev/run.sh julia)…"
          dev/run.sh julia
        fi
      - task: mandel-mame
        vars: { ROM: julia }

  mandel-float:
    desc: "#21: Soft-Float Mandelbrot — escape-time z^2+c in IEEE-754 single-precision `float`, so every op is a soft-float libcall (__mulsf3/__addsf3/__subsf3/__divsf3/__gtsf2/__floatsisf) — the library no other demo touches. 16x14 grid 4x-upscaled into the $7E2000 far framebuffer, Mode-7 zoom (+mos-a16). BIT-EXACT differential: assert corpus_result (mf_gate_crc 0x4169) == host single-precision on bsnes-jg (+ MAME if SPC700 IPL present) + disasm gate (__mulsf3 + __add/subsf3 + rep/sep). Leaves build/mandel-float.sfc + build/mandel-float-{jg,mame}.png."
    cmds:
      - dev/run.sh mandel-float

  mandel-float-play:
    desc: "PLAY the Soft-Float Mandelbrot in a MAME window on this host (builds the ROM first if needed). Shows the chunky escape-time set rendered by software floating point, Mode-7 zooming through the seahorse spiral, colour-cycled."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/mandel-float.sfc ]; then
          echo "==> build/mandel-float.sfc missing — building it (dev/run.sh mandel-float)…"
          dev/run.sh mandel-float
        fi
      - task: mandel-mame
        vars: { ROM: mandel-float }

  avalanche:
    desc: "#22: 64-Bit Avalanche — splitmix64 hash matrix, every op a 64-bit libcall (__muldi3/__lshrdi3/__ashldi3/__udivdi3/__adddi3) — the integer-width family no other demo touches. Cell (i,j)=output bit j of hash64(seed^(1<<i)); a correct mixer => ~50% dense rainbow field. BIT-EXACT: assert corpus_result (h64_gate_crc 0x27EA) == host on bsnes-jg (+ MAME if SPC700 IPL present) + disasm gate (__muldi3 + 64-bit shift + __udivdi3 + rep/sep). Leaves build/avalanche.sfc + build/avalanche-{jg,mame}.png."
    cmds:
      - dev/run.sh avalanche

  avalanche-play:
    desc: "PLAY the 64-Bit Avalanche in a MAME window on this host (builds the ROM first if needed). Shows a shimmering rainbow avalanche matrix — every cell a 64-bit splitmix64 hash bit."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/avalanche.sfc ]; then
          echo "==> build/avalanche.sfc missing — building it (dev/run.sh avalanche)…"
          dev/run.sh avalanche
        fi
      - task: mandel-mame
        vars: { ROM: avalanche }

  truchet:
    desc: "#29b: Truchet packed-bitfields — a 16x16 '10 PRINT' diagonal maze where every cell is a uint16 BITFIELD struct (orient:1/style:1/hue:3/phase:2/mark:1/energy:4); a wave ripples through it, reading/writing fields. Stresses bitfield insert/extract codegen (and/ora/shift, NO libcalls). BIT-EXACT: assert corpus_result (tr_gate_crc 0xB3E6) == host on bsnes-jg (+ MAME if SPC700 IPL) + disasm gate (and/ora/shift/rep, libcalls=0). Leaves build/truchet.sfc + build/truchet-{jg,mame}.png."
    cmds:
      - dev/run.sh truchet

  truchet-play:
    desc: "PLAY the Truchet bitfields maze in a MAME window on this host (builds the ROM first if needed). Shows a colour-rippling 10-PRINT diagonal labyrinth, every cell a packed uint16 bitfield."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/truchet.sfc ]; then
          echo "==> build/truchet.sfc missing — building it (dev/run.sh truchet)…"
          dev/run.sh truchet
        fi
      - task: mandel-mame
        vars: { ROM: truchet }

  boids:
    desc: "#26: Boids Flock — Reynolds flocking on a vec2 {int16_t x,y} VALUE type; the steering kernel takes/returns struct BY VALUE (noinline), exercising the aggregate-return ABI (register-pair vs sret) O(N^2)/frame — untested by every other demo. Integer fixed-point => bit-exact; assert corpus_result (boids_gate_crc 0xA8AB) == host on bsnes-jg (+ MAME if SPC700 IPL) + disasm gate (by-value calls + __mulsi3 + rep/sep). Leaves build/boids.sfc + build/boids-{jg,mame}.png."
    cmds:
      - dev/run.sh boids

  boids-play:
    desc: "PLAY the Boids Flock demo in a MAME window on this host (builds the ROM first if needed). A flock of dots clumps, aligns into heading-coloured streams, and avoids collisions — the visual proof the struct-by-value ABI is correct."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/boids.sfc ]; then
          echo "==> build/boids.sfc missing — building it (dev/run.sh boids)…"
          dev/run.sh boids
        fi
      - task: mandel-mame
        vars: { ROM: boids }

  turtle-vm:
    desc: "#29a: Bytecode-VM Turtle — a stack-machine bytecode interpreter draws LOGO turtle graphics; the dense switch(op) lowers to a JMP (abs,X) jump-table dispatch (JMPIdxIndir) and the ALU ops dispatch through a function-pointer opcode table (jsr __call_indir) — the indirect/computed control-flow corners no other demo runs. Integer fixed-point => bit-exact; assert corpus_result (vm_gate_crc 0x4007) == host on bsnes-jg (+ MAME if SPC700 IPL) + disasm gate (jump-table + __call_indir + rep/sep). Leaves build/turtle-vm.sfc + build/turtle-vm-{jg,mame}.png."
    cmds:
      - dev/run.sh turtle-vm

  turtle-vm-play:
    desc: "PLAY the Bytecode-VM Turtle demo in a MAME window on this host (builds the ROM first if needed). A turtle interpreter draws a multi-colour spiral rosette = the visual proof the jump-table + function-pointer dispatch is correct."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/turtle-vm.sfc ]; then
          echo "==> build/turtle-vm.sfc missing — building it (dev/run.sh turtle-vm)…"
          dev/run.sh turtle-vm
        fi
      - task: mandel-mame
        vars: { ROM: turtle-vm }

  lsystem:
    desc: "#23: L-System Plant — grows an L-system by string rewriting (each generation rewrites a char buffer IN PLACE with memmove + memcpy + strlen, the string-libcall corner no other demo runs) then a turtle interprets it with a bracket push/pop stack into a fractal plant. Integer fixed-point => bit-exact; assert corpus_result (lsystem_gate_crc 0x79C3) == host on bsnes-jg (+ MAME if SPC700 IPL) + disasm gate (memcpy/memmove + strlen + rep/sep). Leaves build/lsystem.sfc + build/lsystem-{jg,mame}.png."
    cmds:
      - dev/run.sh lsystem

  lsystem-play:
    desc: "PLAY the L-System Plant demo in a MAME window on this host (builds the ROM first if needed). A string-rewriting L-system grows into a fractal plant = the visual proof the memcpy/memmove/strlen string build + bracket stack are correct."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/lsystem.sfc ]; then
          echo "==> build/lsystem.sfc missing — building it (dev/run.sh lsystem)…"
          dev/run.sh lsystem
        fi
      - task: mandel-mame
        vars: { ROM: lsystem }

  factorial:
    desc: "#20: Bignum factorial — 1000! in a base-10000 digit array; custom 28-row FactDisplay drawable; assert corpus_result (factorial_gate_crc for 50!, 0x772F) == host on MAME + bsnes-jg + disasm gate (__mulsi3 + __udivmodsi4 + rep/sep). Leaves build/factorial.sfc + build/factorial-{mame,jg}.png."
    cmds:
      - dev/run.sh factorial

  factorial-play:
    desc: "PLAY the bignum factorial demo in a MAME window on this host (builds the ROM first if needed). Displays growing n! digit-by-digit filling the screen."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/factorial.sfc ]; then
          echo "==> build/factorial.sfc missing — building it (dev/run.sh factorial)…"
          dev/run.sh factorial
        fi
      - task: mandel-mame
        vars: { ROM: factorial }

  cordic:
    desc: "#12: CORDIC rotator — sin/cos/atan via shift-add only (no multiply); rotating hand over a CORDIC vector field. Assert corpus_result (cordic_gate_crc 0x4D41) == host on MAME + bsnes-jg + INVERTED disasm gate (mul/div/vshift=0, rep/sep + cordic16_atan_tbl present). Leaves build/cordic.sfc + build/cordic-{mame,jg}.png."
    cmds:
      - dev/run.sh cordic

  cordic-play:
    desc: "PLAY the CORDIC rotator demo in a MAME window on this host (builds the ROM first if needed). Shows a rotating hand sweeping a CORDIC-computed vector field + an atan2 angle self-check."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/cordic.sfc ]; then
          echo "==> build/cordic.sfc missing — building it (dev/run.sh cordic)…"
          dev/run.sh cordic
