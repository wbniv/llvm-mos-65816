      - task: mandel-mame
        vars: { ROM: divclock }

  iir-scope:
    desc: "#48: IIR resonant-filter scope — recursive feedback dependency chain (y[n]=a1*y[n-1]+a2*y[n-2]+x[n], non-reorderable). Four plucked resonators on an oscilloscope. Assert corpus_result (iir_scope_gate_crc 0x5177) == host on MAME + bsnes-jg + disasm gate (__mulsi3 feedback multiply + rep/sep). Leaves build/iir-scope.sfc + build/iir-scope-{mame,jg}.png."
    cmds:
