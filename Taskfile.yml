  editdist:
    desc: "#66: Edit-distance DP — for each word pair the (m+1)x(n+1) Levenshtein table D[i][j] is filled by the min-recurrence D[i][j]=min(sub,del,ins), then the optimal alignment is backtracked from D[m][n] to D[0][0]. Drawn as a cost heat-map with the path lit. A 2-D dynamic-programming table (true D[i][j] addressing) + min-recurrence + backtrack, none of the first 65 demos run. Gate cross-checks symmetry (edit(A,B)==edit(B,A)). Assert corpus_result (editdist_gate_crc 0xFB59) == host on MAME + bsnes-jg + disasm gate. Leaves build/editdist.sfc + build/editdist-{mame,jg}.png."
