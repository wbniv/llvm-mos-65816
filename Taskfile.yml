  polyfill:
    desc: "#36: Polygon scanline fill (VLA) — a tumbling star whose vertex count morphs at run time drives an even-odd scanline rasteriser with a RUNTIME-SIZED C99 VLA (int16_t xs[nv]) — the soft-stack alloca/VLA stress. Assert corpus_result (polyfill_gate_crc 0x8ED9) == host on MAME + bsnes-jg + disasm gate (__divsi3/__udivsi3 crossing divide + __mulsi3 vertex + rep/sep). Leaves build/polyfill.sfc + build/polyfill-{mame,jg}.png."
