  maze:
    desc: "#18: Maze generate + solve — recursive-division carve (genuine recursion, ~log depth to fit the 65816 256-byte HW stack) + A* indexed binary-heap solve (16x15), animated. Assert corpus_result (maze_gate_crc 0x0749) == host on bsnes-jg (+ MAME if SPC700 IPL present) + disasm gate (recursion self-call + rep/sep; no 32-bit libcalls). Leaves build/maze.sfc + build/maze-{jg,mame}.png."
