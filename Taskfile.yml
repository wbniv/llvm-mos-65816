  huffman:
    desc: "#67: Huffman decode reveal — a 16x16 image is Huffman-encoded into a bitstream, then decoded bit by bit (pull one bit MSB-first, descend the pointer-linked Huffman tree left/right, emit a symbol at each leaf) and revealed a few pixels per frame — the classic image loading-in. A bit-granular stream reader + tree descent, distinct from #49's byte-oriented LZ. Gate cross-checks decode == original. Assert corpus_result (huffman_gate_crc 0xE8E4) == host on MAME + bsnes-jg + disasm gate (bit-shifts, tree refs). Leaves build/huffman.sfc + build/huffman-{mame,jg}.png."
