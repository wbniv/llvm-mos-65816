  bitshuffle-play:
    desc: "PLAY the Perfect-Shuffle Transition demo in a MAME window on this host (builds the ROM first if needed). Shows an image scramble into bit-reversed order and un-scramble, with a byte-swap recolour."
    cmds:
      - |
        set -euo pipefail
