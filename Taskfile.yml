version: '3'

# Shared cross-project tasks (md, shot, pr-preview, memory-viz, …) from the
# python-tui-lib library. flatten: true exposes them at top level so
# `task md -- TODO.md` works; optional: true keeps `task` usable if the
# sibling repo isn't checked out next to this one.
includes:
  shared:
    taskfile: ../python-tui-lib/Taskfile.shared.yml
    optional: true
    flatten: true

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # --- Host-side dev/test prerequisites ---

  dev-setup:
    desc: "Install host-side dev/test prerequisites (cvise for C-reduction of fuzz repros, …). Idempotent; uses sudo apt."
    silent: true
    cmds:
      - |
        set -euo pipefail
        need=()
        command -v cvise >/dev/null || need+=(cvise)
        if [ ${#need[@]} -eq 0 ]; then echo "host prereqs already present: cvise"; exit 0; fi
        echo "installing: ${need[*]}"
        sudo apt-get update -qq
        sudo apt-get install -y "${need[@]}"

  # --- Dev image / build pipeline (thin wrappers over dev/run.sh) ---

  build:
    desc: "(re)build the dev image, vendor llvm-mos-sdk + platforms/snes, compile examples/snes/hello.c -> build/hello.sfc"
    cmds:
      - dev/run.sh build

  compile:
    desc: "Compile the SNES example inside the dev container (assumes the image is already built)"
    cmds:
      - dev/run.sh compile

  validate:
    desc: "Structural validation of build/hello.sfc (reset->crt0 byte-exact, main() placed, checksum 0xFFFF)"
    cmds:
      - dev/run.sh validate

  title-mode-audit:
    desc: "Assert every, and only, true Mode 7 demo uses the Mode 7 zoom/spin title"
    cmds:
      - dev/title-mode-audit.sh
      - dev/title-charset.sh

  smoke:
    desc: "Boot build/hello.sfc headless in MAME's snes driver, assert sentinel==0x42 in WRAM (needs the SPC700 IPL)"
    cmds:
      - dev/run.sh smoke

  repro:
    desc: "Clean-room: fresh checkout, then build + smoke inside it (host-side orchestration)"
    cmds:
      - dev/run.sh repro {{.CLI_ARGS}}

  # --- Interim release packaging (until #320/#321 land upstream) ---

  release-builtins:
    desc: "Force-rebuild the toolchain's mos compiler-rt builtins so libclang_rt.builtins.a matches the CURRENT backend data layout. LLVM's runtimes sub-build doesn't re-trigger on a backend-only change (e.g. patch 0006 adding the packed-24 'p3:24:8' addrspace), leaving stale builtins that the SDK merges into libcrt → 'different data layouts' warnings on every user link. Reinstalls into build/llvm-mos-install."
    cmds:
      - dev/run.sh rebuild-builtins

  release-sdk:
    desc: "Clean-rebuild build/install (SNES SDK) against the PATCHED toolchain so libc/crt0/libcrt carry the far-pointer data layout — eliminates the ld.lld 'different data layouts' warnings. Forces a CLEAN build (sentinel stamp) because an incremental SDK build does NOT re-merge libcrt after release-builtins refreshes the toolchain's builtins.a."
    deps: [release-builtins]
    cmds:
      # Make dev/build.sh wipe + clean-rebuild: its toolchain stamp is path-based and
      # can't see that release-builtins changed the toolchain's builtins.a *content*.
      # A clean build is the only thing that reliably re-merges libcrt.
      - echo 'release-clean' > build/.mos-toolchain
      - MOS_TOOLCHAIN=/work/build/llvm-mos-install dev/run.sh build

  package:
    desc: "Assemble the relocatable Linux x86-64 toolchain+SDK into dist/llvm-mos-65816-<stamp>-linux-x86_64.tar.xz (+ .sha256). GATES (both must pass or the tarball is not a publish candidate): (1) WARNING-FREE self-test — fails on any clang/ld.lld warning; (2) CLEAN-ROOM emulator test — task release-test METHOD=local builds+runs the tarball's own mos-snes-clang in bsnes-jg (default-8bit + +mos-a16) and asserts the WRAM CRC. Runs release-builtins + release-sdk first. Env: STRIP=0 keeps debug, RELEASE_DOCS_DIR=<dir> bundles docs, SKIP_RELEASE_TEST=1 bypasses the clean-room gate (NOT for a real publish)."
    deps: [release-sdk]
    cmds:
      - dev/package-release.sh {{.CLI_ARGS}}

  cross-build:
    desc: "Cross-build the clang/lld/llvm-* HOST tools for a NON-native host into build/llvm-mos-install-<PLATFORM>. PLATFORM=linux-arm64|windows-x86_64. Needs the native toolchain built first (reuses its tablegens). Long (~30-90 min cold; ccache-warm after). e.g. `task cross-build PLATFORM=linux-arm64`."
    cmds:
      - dev/run.sh cross-toolchain {{.PLATFORM}}

  package-all:
    desc: "Assemble ALL 3 interim platform packages into dist/: linux-x86_64 (kept, byte-identical) + linux-arm64 + windows-x86_64. The native leg runs the full SDK-rebuild + clean-room bsnes-jg gate; the cross legs reuse the native SDK and self-test under qemu/wine (ROM bytes must match native). PREREQ: both cross toolchains built (task cross-build PLATFORM=linux-arm64 ; task cross-build PLATFORM=windows-x86_64). macOS arm64 is deferred (needs a macOS SDK). Interim until #321 lands upstream."
    cmds:
      - task: package
      - dev/package-release.sh PLATFORM=linux-arm64
      - dev/package-release.sh PLATFORM=windows-x86_64
      - 'echo "==> dist/ now holds:" && ls -1 dist/*.tar.xz dist/*.zip 2>/dev/null'

  release-test:
    desc: "Clean-room test the PUBLISHED SNES compiler in a throwaway Docker container with NO dev toolchain: acquire mos-snes-clang, compile examples/snes/mandel-display.c (+mos-a16 — the far/16-bit tester is a16-only), run in bsnes-jg (embedded SPC700 IPL → no BIOS/sound), assert the WRAM corpus_result CRC == the host oracle (0x204F) + dump an emulator PNG. METHOD=local (newest dist/*.tar.xz — the publish gate, also auto-run by `task package`) | apt (live apt.indri.studio) | tarball (product-page link). Knobs: PROGRAM=mandel-display|k_mandel, A16=both|1|0 (mandel-display forces a16-only), TARBALL=<path>, FRAMES=n. Pass as `task release-test -- METHOD=apt`."
    cmds:
      - dev/test-release.sh {{.CLI_ARGS}}

  ci-watch:
    desc: "Live-monitor a GitHub Actions run (default: latest snes-smoke): streams step transitions + heartbeat + final verdict. Args: [RUN_ID] | --once"
    cmds:
      - dev/ci-watch.sh {{.CLI_ARGS}}

  # --- #321 beefy Mandelbrot demo ---

  mandel-mame:
    desc: "Run a Mandelbrot demo ROM in a MAME WINDOW on this host (ROM=mandel-display [default] | k_mandel_far). Build the ROM first via task mandel-shot / mandel-far."
    cmds:
      - |
        set -euo pipefail
        ROM='{{.ROM | default "mandel-display"}}'
        SFC="build/${ROM}.sfc"
        if [ ! -f "$SFC" ]; then
          echo "missing $SFC — build it first:"
          case "$ROM" in
            mandel-display) echo "    task mandel-shot   (far Mode 7 tester)";;
            k_mandel_far)   echo "    task mandel-far    (Track 3a far-store gate)";;
            *)              echo "    (unknown ROM '$ROM' — use mandel-display | k_mandel_far)";;
          esac
          exit 1
        fi
        [ -f dev/roms/s_smp/spc700.rom ] || { echo "missing dev/roms/s_smp/spc700.rom (SPC700 IPL) — MAME's snes driver needs it."; exit 1; }
        case "$ROM" in
          mandel-display) echo "note: the image appears after the ~15 s (emulated) compute." ;;
        esac
        echo "launching $SFC in MAME — close the window to quit."
        mkdir -p build/.mame
        # MAME's default SNES P1 keys are non-obvious (SNES R=keyboard X, Y=Left-Ctrl, A=Space), so the
        # demo labels wouldn't match the keys. Drop in our remap (snes.cfg) so keyboard R/L/Y/A/S/Enter
        # match the on-screen R/L/Y/A/Select/Start; D-pad stays on the arrows. See dev/mame-snes-input.cfg.
        cp -f dev/mame-snes-input.cfg build/.mame/snes.cfg
        exec mame snes -cart "$SFC" -rompath dev/roms -skip_gameinfo -window \
          -cfg_directory build/.mame -nvram_directory build/.mame

  mandel-shot:
    desc: "#321: render the canonical on-SNES Mandelbrot tester (far-stored into high WRAM, displayed via Mode 7; +mos-a16) ON the SNES, screenshot from MAME + bsnes-jg (headless). Leaves build/mandel-display.sfc."
    cmds:
      - dev/run.sh mandel-shot

  mandel-oop:
    desc: "snesgfx formal verification: OOP Mandelbrot — Mode 7 as a Drawable (MandelLayer), corpus_result == 0x204F (+mos-a16). Proves: (1) Mode 7 OOP, (2) no bare REG_*/snes_* in main(), (3) coarse-grained dispatch (1 virtual call/frame). Disasm + size delta vs mandel-display printed. Leaves build/mandel-oop.sfc + build/mandel-oop-jg.png."
    cmds:
      - dev/run.sh mandel-oop

  mandel-oop-play:
    desc: "PLAY the OOP Mandelbrot verification client in a MAME window (builds first if needed). Same 64x56 Mandelbrot as mandel-display but orchestrated through the snesgfx Display + MandelLayer OOP interface."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/mandel-oop.sfc ]; then
          echo "==> build/mandel-oop.sfc missing — building it (dev/run.sh mandel-oop)…"
          dev/run.sh mandel-oop
        fi
      - task: mandel-mame
        vars: { ROM: mandel-oop }

  mandel-far:
    desc: "#321 Track 3a: Mandelbrot into high WRAM via #320 far stores, asserted host==+mos-a16 on both emulators. Leaves build/k_mandel_far.sfc."
    cmds:
      - dev/run.sh mandel-far

  blossom:
    desc: "#3: the INTERACTIVE Hopalong/Blossom attractor on the SNES — far read-modify-write hit grid + Mode 7 band DMA + cycling hue palette + split-screen HUD + joypad. +mos-a16-only; asserts the grid hash host==+mos-a16 on both emulators AND a scripted-input controller-state differential, screenshots both. Leaves build/blossom.sfc (then: task blossom-play)."
    cmds:
      - dev/run.sh blossom

  blossom-grid:
    desc: "#3 Stage 1: the headless far read-modify-write HIT-GRID gate — plot Hopalong points into a 128x128 grid at high WRAM $7E2000 via the far path, far-load hash, assert host==+mos-a16 on both emulators + a far-RMW disasm gate. Leaves build/k_blossom_far.sfc."
    cmds:
      - dev/run.sh blossom-grid

  blossom-play:
    desc: "PLAY the interactive Blossom attractor in a MAME WINDOW on this host (builds the ROM first if needed). The attractor blooms in over ~10 s then shimmers. Arrows pan | L/R zoom | A/Y next/prev attractor | Select colour | Start reset."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/blossom.sfc ]; then
          echo "==> build/blossom.sfc missing — building it (dev/run.sh blossom)…"
          dev/run.sh blossom
        fi
      - task: mandel-mame
        vars: { ROM: blossom }

  buddha:
    desc: "#4: Buddhabrot — escaping-orbit DENSITY accumulation on the SNES — far scatter-write hit grid ($7E2000) + Mode 7 band DMA + ghostly glow palette. +mos-a16-only; asserts the grid hash host==+mos-a16 on bsnes-jg + MAME, screenshots both. Leaves build/buddha.sfc + build/buddha-{jg,mame}.png (then: task buddha-play)."
    cmds:
      - dev/run.sh buddha

  buddha-grid:
    desc: "#4 headless: the far SCATTER-WRITE density-grid gate — draw K_GATE random samples, iterate z^2+c, replay escaping orbits into a 128x128 grid at high WRAM $7E2000 via the far RMW path, far-load hash, assert host==+mos-a16 on both emulators + a far-RMW + complex-multiply disasm gate. Leaves build/k_buddha_far.sfc."
    cmds:
      - dev/run.sh buddha-grid

  buddha-play:
    desc: "PLAY the Buddhabrot demo in a MAME WINDOW on this host (builds the ROM first if needed). The density cloud blooms in progressively as escaping orbits accumulate."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/buddha.sfc ]; then
          echo "==> build/buddha.sfc missing — building it (dev/run.sh buddha)…"
          dev/run.sh buddha
        fi
      - task: mandel-mame
        vars: { ROM: buddha }

  spirograph:
    desc: "#11: render the Spirograph (hypotrochoid) demo on SNES (+mos-a16); assert curve hash host==+mos-a16 on MAME + bsnes-jg + disasm gate. Leaves build/spirograph.sfc + build/spirograph-{mame,jg}.png."
    cmds:
      - dev/run.sh spirograph

  n-body:
    desc: "#13: N-body orbits — Newtonian gravity (1/r²) + Verlet; assert corpus_result (nbody_gate_crc 0xCC65) == host on MAME + bsnes-jg + disasm gate (__udivsi3 + __mulsi3 + rep/sep). Leaves build/n-body.sfc + build/n-body-{mame,jg}.png."
    cmds:
      - dev/run.sh n-body

  pi:
    desc: "#19: render the π Spigot + Monte-Carlo demo on SNES (+mos-a16); assert corpus_result (pi_gate_crc 0x7711) == host on MAME + bsnes-jg + disasm gate (__udivmodsi4 + __mulsi3 + rep/sep). Leaves build/spigot.sfc + build/spigot-{mame,jg}.png."
    cmds:
      - dev/run.sh pi

  bf-vm:
    desc: "#38: Brainfuck threaded-code VM — computed goto (goto *handlers[op] → indirect jmp). Runs Hello World; assert corpus_result (bf_vm_gate_crc 0x9954) == host on MAME + bsnes-jg + disasm gate (indirect-jmp + rep/sep, control-flow only, no __mul/__udiv). Leaves build/bf-vm.sfc + build/bf-vm-{mame,jg}.png."
    cmds:
      - dev/run.sh bf-vm

  bf-vm-play:
    desc: "PLAY the Brainfuck threaded-code VM demo in a MAME window on this host (builds the ROM first if needed). Shows the program pointer scrubbing the source, the tape heat-grid mutating, and the OUT marquee filling in HELLO WORLD!, looping."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/bf-vm.sfc ]; then
          echo "==> build/bf-vm.sfc missing — building it (dev/run.sh bf-vm)…"
          dev/run.sh bf-vm
        fi
      - task: mandel-mame
        vars: { ROM: bf-vm }

  hdr-bloom:
    desc: "#44: HDR additive-bloom — saturating / overflow-checked add (__builtin_add_overflow → adc; bcs). Six drifting glows sum per cell, clamping to white where they pile up. Assert corpus_result (hdr_bloom_gate_crc 0x2798) == host on MAME + bsnes-jg + disasm gate (adc + carry-branch + rep/sep). Leaves build/hdr-bloom.sfc + build/hdr-bloom-{mame,jg}.png."
    cmds:
      - dev/run.sh hdr-bloom

  hdr-bloom-play:
    desc: "PLAY the HDR bloom demo in a MAME window on this host (builds the ROM first if needed). Shows six drifting lights blooming and blowing out to white where they overlap."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/hdr-bloom.sfc ]; then
          echo "==> build/hdr-bloom.sfc missing — building it (dev/run.sh hdr-bloom)…"
          dev/run.sh hdr-bloom
        fi
      - task: mandel-mame
        vars: { ROM: hdr-bloom }

  disbits:
    desc: "#52: Cross-byte-boundary bitfield disassembler — a scrolling colour map where each cell decodes a synthetic opcode into bitfields that STRADDLE byte boundaries inside a uint32 (opcode:8, mode:3, len:2, group:5, cycles:4, flags:7, rmw:1; group crosses bit 16, flags crosses bit 24), forcing multi-byte shift+mask. Assert corpus_result (disbits_gate_crc 0x31D7) == host on MAME + bsnes-jg + disasm gate (and-masks, multi-byte shifts, no arith libcall, rep/sep). Leaves build/disbits.sfc + build/disbits-{mame,jg}.png."
    cmds:
      - dev/run.sh disbits

  disbits-play:
    desc: "PLAY the cross-byte bitfield disassembler demo in a MAME window on this host (builds the ROM first if needed). Shows a scrolling colour-coded field-decode map."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/disbits.sfc ]; then
          echo "==> build/disbits.sfc missing — building it (dev/run.sh disbits)…"
          dev/run.sh disbits
        fi
      - task: mandel-mame
        vars: { ROM: disbits }

  critters:
    desc: "#51: Protothread critter swarm — a swarm of critters, each a RESUMABLE protothread that yields each frame and resumes its scripted box-patrol via a saved continuation index (case labels inside loops -> mid-loop re-entry + cross-call state preservation). Assert corpus_result (critters_gate_crc 0xAD9F) == host on MAME + bsnes-jg + disasm gate (critter_step lc-dispatch, jmp branch mesh, no arith libcall, rep/sep). Leaves build/critters.sfc + build/critters-{mame,jg}.png."
    cmds:
      - dev/run.sh critters

  critters-play:
    desc: "PLAY the protothread critter-swarm demo in a MAME window on this host (builds the ROM first if needed). Shows a swarm of critters each running its own scripted patrol."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/critters.sfc ]; then
          echo "==> build/critters.sfc missing — building it (dev/run.sh critters)…"
          dev/run.sh critters
        fi
      - task: mandel-mame
        vars: { ROM: critters }

  cgrade:
    desc: "#50: Many-argument color-grade kernel — a per-cell grade takes 10 int16 params (3 lifts, 3 gammas, gain, mix, bias + base), forcing the extras onto the soft stack (>register-count argument spilling). The coefficients sweep over time, re-grading a gradient. Assert corpus_result (cgrade_gate_crc 0x783F) == host on MAME + bsnes-jg + disasm gate (color_grade call, Lstatic_stack arg spill, rep/sep). Leaves build/cgrade.sfc + build/cgrade-{mame,jg}.png."
    cmds:
      - dev/run.sh cgrade

  cgrade-play:
    desc: "PLAY the many-arg color-grade demo in a MAME window on this host (builds the ROM first if needed). Shows a scene re-grading through looks."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/cgrade.sfc ]; then
          echo "==> build/cgrade.sfc missing — building it (dev/run.sh cgrade)…"
          dev/run.sh cgrade
        fi
      - task: mandel-mame
        vars: { ROM: cgrade }

  lzdec:
    desc: "#49: LZ77/LZSS image-decompress reveal — a compressed picture decoded by a byte-stream state machine that copies back-references from its OWN output (LZ77 sliding window), then progressively revealed cell-by-cell. Assert corpus_result (lzdec_gate_crc 0x0100) == host on MAME + bsnes-jg + disasm gate (LZ_STREAM ref, output writes, no arith libcall, rep/sep). Leaves build/lzdec.sfc + build/lzdec-{mame,jg}.png."
    cmds:
      - dev/run.sh lzdec

  lzdec-play:
    desc: "PLAY the LZ77 image-decompress reveal demo in a MAME window on this host (builds the ROM first if needed). Shows a compressed image loading in progressively."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/lzdec.sfc ]; then
          echo "==> build/lzdec.sfc missing — building it (dev/run.sh lzdec)…"
          dev/run.sh lzdec
        fi
      - task: mandel-mame
        vars: { ROM: lzdec }

  nrecip:
    desc: "#47: Newton-Raphson reciprocal perspective floor — a scrolling checkerboard floor whose 1/z depth mapping is a MULTIPLY-ONLY fixed-point Newton reciprocal (x = x*(2 - m*x), no hardware divide, no divide libcall). Assert corpus_result (nrecip_gate_crc 0x044A) == host on MAME + bsnes-jg + disasm gate (__mulsi3, zero divide libcalls, rep/sep). Leaves build/nrecip.sfc + build/nrecip-{mame,jg}.png."
    cmds:
      - dev/run.sh nrecip

  nrecip-play:
    desc: "PLAY the Newton-reciprocal perspective-floor demo in a MAME window on this host (builds the ROM first if needed). Shows a checkerboard floor rushing forward."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/nrecip.sfc ]; then
          echo "==> build/nrecip.sfc missing — building it (dev/run.sh nrecip)…"
          dev/run.sh nrecip
        fi
      - task: mandel-mame
        vars: { ROM: nrecip }

  qsortviz:
    desc: "#46: libc qsort + comparator-callback sort visualizer — bars reshuffle then re-sort under a rotating function-pointer comparator (ascending / evens-first / descending), each a callback qsort invokes per comparison. CAUGHT A REAL BACKEND BUG: the (x>y)-(x<y) comparator emits G_SCMP which the mos legalizer could not lower (fixed). Assert corpus_result (qsortviz_gate_crc 0x8EA5) == host on MAME + bsnes-jg + disasm gate (qsort call, fn-ptr comparator table, rep/sep). Leaves build/qsortviz.sfc + build/qsortviz-{mame,jg}.png."
    cmds:
      - dev/run.sh qsortviz

  qsortviz-play:
    desc: "PLAY the qsort sort-visualizer demo in a MAME window on this host (builds the ROM first if needed). Shows bars reshuffling and re-sorting under rotating comparators."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/qsortviz.sfc ]; then
          echo "==> build/qsortviz.sfc missing — building it (dev/run.sh qsortviz)…"
          dev/run.sh qsortviz
        fi
      - task: mandel-mame
        vars: { ROM: qsortviz }

  metaball:
    desc: "#45: Union type-pun fast-inverse-sqrt metaballs — a field of merging blobs whose 1/dist falloff is the Quake fast-inverse-sqrt bit hack (union{float f;uint32 i;} reads a float's storage AS an integer, mangles it with 0x5f3759df, reads it back AS a float). Assert corpus_result (metaball_gate_crc 0xAEBE) == host on MAME + bsnes-jg + disasm gate (__mulsf3, magic 0x5f3759df bytes, rep/sep). Leaves build/metaball.sfc + build/metaball-{mame,jg}.png."
    cmds:
      - dev/run.sh metaball

  metaball-play:
    desc: "PLAY the union-punned metaballs demo in a MAME window on this host (builds the ROM first if needed). Shows gooey blobs splitting and fusing."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/metaball.sfc ]; then
          echo "==> build/metaball.sfc missing — building it (dev/run.sh metaball)…"
          dev/run.sh metaball
        fi
      - task: mandel-mame
        vars: { ROM: metaball }

  sodo:
    desc: "#43: Signed 64-bit odometer — a vast signed counter ticks through zero (negative -> positive), each value decomposed into decimal digits via the v%10 / v/=10 loop, which on negatives exercises the SIGN-CORRECTED 64-bit divide+modulo (clang merges the adjacent div+mod into __divmoddi4, distinct from #22's unsigned __udivdi3). Scrolling value tape. Assert corpus_result (sodo_gate_crc 0xD2A2) == host on MAME + bsnes-jg + disasm gate (__divmoddi4, rep/sep). Leaves build/sodo.sfc + build/sodo-{mame,jg}.png."
    cmds:
      - dev/run.sh sodo

  sodo-play:
    desc: "PLAY the signed-64 odometer demo in a MAME window on this host (builds the ROM first if needed). Shows a scrolling tape of signed values ticking through zero."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/sodo.sfc ]; then
          echo "==> build/sodo.sfc missing — building it (dev/run.sh sodo)…"
          dev/run.sh sodo
        fi
      - task: mandel-mame
        vars: { ROM: sodo }

  duff:
    desc: "#42: Dissolve transition via Duff's device — one image dissolves into the next in scattered tile bursts, each revealed tile's 16 bytes copied by the classic switch-into-a-loop (irreducible loop-switch control flow the structurizer can't reduce). Assert corpus_result (duff_gate_crc 0x5531) == host on MAME + bsnes-jg + disasm gate (jmp branch mesh, no arith libcall, rep/sep). Leaves build/duff.sfc + build/duff-{mame,jg}.png."
    cmds:
      - dev/run.sh duff

  duff-play:
    desc: "PLAY the Duff-device dissolve demo in a MAME window on this host (builds the ROM first if needed). Shows one image dissolving into the next in scattered bursts."
    cmds:
      - |
        set -euo pipefail
        if [ ! -f build/duff.sfc ]; then
          echo "==> build/duff.sfc missing — building it (dev/run.sh duff)…"
          dev/run.sh duff
        fi
      - task: mandel-mame
        vars: { ROM: duff }

  poolfx:
    desc: "#41: Free-list pool allocator — a particle fountain recycles 48 fixed slots through a manual singly-linked LIFO free list threaded through the slots (alloc pops the head, free pushes it back). Continuous births/deaths. Assert corpus_result (poolfx_gate_crc 0x2B9B) == host on MAME + bsnes-jg + disasm gate (ldy-indexed slot chase, no arith libcall, rep/sep). Leaves build/poolfx.sfc + build/poolfx-{mame,jg}.png."
    cmds:
