  seqvm:
    desc: "#37: Sparse-switch step-sequencer VM — a register VM whose 14 non-contiguous opcodes force switch(op) to lower to a BINARY-SEARCH COMPARISON TREE (not #29a's jump table / #38's computed goto); the registers drive an 8-bar equalizer. Assert corpus_result (seqvm_gate_crc 0xE8C5) == host on MAME + bsnes-jg + disasm gate (compares>=8, indirect-jmp=0, rep/sep). Leaves build/seqvm.sfc + build/seqvm-{mame,jg}.png."
