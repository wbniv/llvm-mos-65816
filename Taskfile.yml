  mandel-float:
    desc: "#21: Soft-Float Mandelbrot — escape-time z^2+c in IEEE-754 single-precision `float`, so every op is a soft-float libcall (__mulsf3/__addsf3/__subsf3/__divsf3/__gtsf2/__floatsisf) — the library no other demo touches. 16x14 grid 4x-upscaled into the $7E2000 far framebuffer, Mode-7 zoom (+mos-a16). BIT-EXACT differential: assert corpus_result (mf_gate_crc 0x4169) == host single-precision on bsnes-jg (+ MAME if SPC700 IPL present) + disasm gate (__mulsf3 + __add/subsf3 + rep/sep). Leaves build/mandel-float.sfc + build/mandel-float-{jg,mame}.png."
