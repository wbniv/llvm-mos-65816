# The SNES CPU is a WDC 65816, so default to it: every build then gets the upstream
# 65816 instruction selection (TXY/TYX, JSL/JML/BRL, MVN/MVP, PEA/PEI/PER — the
# "65816-specific optimizations" asiekierka flagged on llvm-mos-sdk#415). This line
# alone does NOT enable the #320 far-address-space or #321 16-bit codegen — those are
# layered opt-ins (addrspace(2), +mos-a16/+mos-xy16) on top of -mcpu=mosw65816.
# snes-far inherits this via `@mos-snes.cfg`. The crt0 is still assembled without
# -mcpu (it hand-encodes its native-mode preamble as .byte); see CMakeLists.txt.
-mcpu=mosw65816
-mlto-zp=224
-D__SNES__
