name: defect-evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  defect-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test evidence and prior-work requirements
        run: python3 dev/test-defect-evidence.py
      - name: Validate canonical records and retained evidence
        run: python3 dev/check-defect-evidence.py --worktree
