<?xml version="1.0"?>
<!-- MAME input remap for the SNES Mandelbrot demos (task mandel-mame).
     MAME's DEFAULT SNES P1 keys are non-obvious (SNES R = BUTTON6 = keyboard X, SNES Y =
     BUTTON1 = Left-Ctrl, SNES A = BUTTON3 = Space), so the demos' on-screen labels (R/L/Y/A/…)
     don't match the keys you'd guess — which is why "Y/A/R don't work" if you press those letters.
     This binds each SNES button to its MATCHING keyboard letter, so the labels just work: press
     keyboard R for SNES R, Y for SNES Y, A for SNES A, etc. The mandel-* play tasks copy this to
     their -cfg_directory as snes.cfg before launching.

     The tag/mask/type come from the running machine (the SNES pad is a slot device at
     :ctrl1:joypad:JOYPAD, so MAME needs the full port spec, not just the type, to match):
     Y=BUTTON1/mask2, B=BUTTON2/mask1, A=BUTTON3/mask256, X=BUTTON4/mask512, L=BUTTON5/mask1024,
     R=BUTTON6/mask2048, Select=mask4, Start=mask8. D-pad stays on the arrow keys (its default). -->
<mameconfig version="10">
    <system name="snes">
        <input>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON1" mask="2" defvalue="0">
                <newseq type="standard">KEYCODE_Y</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON2" mask="1" defvalue="0">
                <newseq type="standard">KEYCODE_B</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON3" mask="256" defvalue="0">
                <newseq type="standard">KEYCODE_A</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON4" mask="512" defvalue="0">
                <newseq type="standard">KEYCODE_X</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON5" mask="1024" defvalue="0">
                <newseq type="standard">KEYCODE_L</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_BUTTON6" mask="2048" defvalue="0">
                <newseq type="standard">KEYCODE_R</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_SELECT" mask="4" defvalue="0">
                <newseq type="standard">KEYCODE_S</newseq>
            </port>
            <port tag=":ctrl1:joypad:JOYPAD" type="P1_START" mask="8" defvalue="0">
                <newseq type="standard">KEYCODE_ENTER</newseq>
            </port>
        </input>
    </system>
</mameconfig>
