<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOS upstream work — zoomable flowchart</title><meta name="source-sha256" content="@@SOURCE_SHA@@"><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#17233a;background:#f8fafc;height:100vh;display:flex;flex-direction:column}header{flex:none;padding:12px 22px;border-bottom:1px solid #ccd6e4;background:white}h1{font-size:21px;margin:0 0 10px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,a{font:inherit}button{padding:5px 13px;background:#edf2fa;border:1px solid #a7b7cc;border-radius:6px;cursor:pointer}a{color:#165ac4;margin-left:16px}.hint{color:#596579;margin-left:12px}#viewport{flex:1;min-height:0;overflow:auto;padding:32px;cursor:grab;touch-action:auto}#viewport.dragging{cursor:grabbing;user-select:none}#chart{width:max-content;background:white;border-radius:10px;padding:20px}#chart svg{max-width:none!important;display:block;height:auto}#fallback{white-space:pre-wrap;max-width:1100px}#zoom{min-width:54px;font-variant-numeric:tabular-nums}.status{font-size:13px;color:#596579;margin:8px 0 0}@media(max-width:750px){.hint{display:none}}
</style></head><body><header><h1>Upstream work and dependencies</h1><div class="toolbar"><button id="minus" aria-label="Zoom out">−</button><span id="zoom">100%</span><button id="plus" aria-label="Zoom in">+</button><button id="actual">Readable size</button><button id="fit">Fit entire chart</button><button id="fullscreen">Full screen</button><a href="@@SOURCE_LINK@@">Tracker and evidence</a><a href="@@STATUS_LINK@@">Overview</a><span class="hint">Drag to pan · Ctrl + wheel to zoom</span></div><p class="status">Local work: @@LOCAL_DATE@@ · Recorded GitHub snapshot: @@REMOTE_DATE@@ · Fixed locally does not mean published</p></header><div id="viewport"><div id="chart"><pre id="fallback">@@DIAGRAM@@</pre></div></div><script type="module">
const viewport=document.querySelector('#viewport'), chart=document.querySelector('#chart');
let svg, baseWidth, baseHeight, zoom=1;
function setZoom(value){if(!svg)return;zoom=Math.max(.02,Math.min(4,value));svg.style.width=`${baseWidth*zoom}px`;document.querySelector('#zoom').textContent=`${Math.round(zoom*100)}%`;}
document.querySelector('#minus').onclick=()=>setZoom(zoom/1.25);
document.querySelector('#plus').onclick=()=>setZoom(zoom*1.25);
document.querySelector('#actual').onclick=()=>setZoom(1);
document.querySelector('#fit').onclick=()=>setZoom(Math.min((viewport.clientWidth-104)/baseWidth,(viewport.clientHeight-104)/baseHeight));
document.querySelector('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
viewport.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZoom(zoom*(e.deltaY<0?1.1:1/1.1));}},{passive:false});
let drag;
viewport.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0){drag={x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging');}});
viewport.addEventListener('pointermove',e=>{if(drag){viewport.scrollLeft=drag.left+drag.x-e.clientX;viewport.scrollTop=drag.top+drag.y-e.clientY;}});
function stop(){drag=null;viewport.classList.remove('dragging');}
viewport.addEventListener('pointerup',stop);viewport.addEventListener('pointercancel',stop);
try{
const {default:mermaid}=await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'neutral',themeVariables:{fontSize:'20px',fontFamily:'system-ui, sans-serif'},flowchart:{useMaxWidth:false,nodeSpacing:40,rankSpacing:65}});
const source=document.querySelector('#fallback').textContent;
const result=await mermaid.render('dependency-chart',source);chart.innerHTML=result.svg;svg=chart.querySelector('svg');
const view=svg.viewBox.baseVal;baseWidth=view.width;baseHeight=view.height;setZoom(1);
}catch(error){console.warn(error);document.querySelector('#zoom').textContent='Text';}
</script></body></html>
